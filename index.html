<style>
/* Home v2 Composition */
.home-v2 .shell-hero{padding-top:clamp(58px,8vw,96px)}
.home-v2 .hero-grid-shell{grid-template-columns:minmax(0,.85fr) minmax(420px,1.15fr);align-items:center;gap:clamp(38px,6vw,96px)}
.home-v2 .shell-title{max-width:11ch;font-size:clamp(52px,8.5vw,112px);letter-spacing:-.07em}
.home-v2 .shell-lead{max-width:52ch}
.home-v2 .hero-side-shell{min-width:0}

/* System Map & Animations */
.system-map{position:relative;min-height:430px;padding:36px 34px;border:1px solid var(--shell-line-strong);border-radius:18px;background:radial-gradient(600px 360px at 50% 50%,rgba(113,194,155,.08),transparent 68%),#080b0d;overflow:hidden;box-shadow:var(--shell-shadow)}
.system-map::before,.system-map::after{content:"";position:absolute;pointer-events:none;border:1px solid rgba(148,183,204,.16);border-radius:50%}
.system-map::before{width:420px;height:420px;left:50%;top:50%;transform:translate(-50%,-50%)}.system-map::after{width:270px;height:270px;left:50%;top:50%;transform:translate(-50%,-50%);border-color:rgba(213,182,108,.22)}
.map-label{position:relative;z-index:2;display:flex;justify-content:space-between;color:var(--shell-muted);font:11px 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.map-label span:last-child{color:var(--shell-green)}
.map-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}.map-lines line{stroke:rgba(148,183,204,.32);stroke-width:1}.map-lines circle{fill:#080b0d;stroke:var(--shell-accent);stroke-width:1.5}.map-lines .green{stroke:var(--shell-green);fill:var(--shell-green);animation:pulse-glow 3s infinite ease-in-out}
@keyframes pulse-glow{0%,100%{opacity:.4;r:4px}50%{opacity:1;r:6px}}
.map-node{position:absolute;z-index:3;width:148px;padding:15px 16px;border:1px solid var(--shell-line-strong);border-radius:10px;background:rgba(13,17,22,.94);box-shadow:0 12px 30px rgba(0,0,0,.2)}.map-node strong{display:block;margin-bottom:5px;font:600 17px 'Space Grotesk',sans-serif;letter-spacing:-.03em}.map-node span{display:block;color:var(--shell-muted);font-size:11px;line-height:1.35}.map-node small{display:block;margin-top:10px;color:var(--shell-accent-strong);font:10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}.map-node.context{left:7%;top:30%;border-color:rgba(148,183,204,.45)}.map-node.vault{right:7%;top:30%;border-color:rgba(113,194,155,.48)}.map-node.ledger{left:50%;bottom:8%;transform:translateX(-50%);border-color:rgba(213,182,108,.5)}
.map-core{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:126px;height:126px;display:grid;place-items:center;text-align:center;border:1px solid var(--shell-accent);border-radius:50%;background:rgba(17,23,29,.94);box-shadow:0 0 0 12px rgba(213,182,108,.05),0 0 50px rgba(213,182,108,.1);transition:box-shadow .3s ease}.map-core:hover{box-shadow:0 0 0 12px rgba(213,182,108,.12),0 0 60px rgba(213,182,108,.25)}.map-core strong{font:600 20px 'Space Grotesk',sans-serif;letter-spacing:-.04em}.map-core span{display:block;margin-top:3px;color:var(--shell-faint);font:10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}

/* Trust Badges */
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font:500 11px 'IBM Plex Mono',monospace;background:var(--shell-surface);border:1px solid var(--shell-line-strong);color:var(--shell-muted);text-decoration:none;transition:border-color .2s ease,color .2s ease}
.badge-pill:hover{border-color:var(--shell-accent);color:var(--shell-accent-strong)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--shell-green)}

/* Clickable Proof Rail */
.home-v2 .proof-rail{margin-top:34px;grid-template-columns:1.15fr 1fr 1fr 1fr}
.proof-rail a.proof-cell{text-decoration:none;color:inherit;transition:border-color .2s ease,background .2s ease;display:block}
.proof-rail a.proof-cell:hover{border-color:var(--shell-accent);background:rgba(213,182,108,.05)}
.home-v2 .proof-cell:first-child{background:color-mix(in srgb,var(--shell-surface) 90%,var(--shell-accent))}

/* Featured Audit Banner */
.audit-banner{padding:32px 36px;border:1px solid var(--shell-accent);border-radius:16px;background:radial-gradient(800px 240px at 0% 0%,rgba(213,182,108,.12),transparent 70%),var(--shell-surface);box-shadow:0 10px 40px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center}

/* Code Comparison Section */
.code-preview-section{margin-top:36px}
.code-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--shell-line);border:1px solid var(--shell-line-strong);border-radius:14px;overflow:hidden}
.code-box{padding:22px;background:#080b0d;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.6;color:var(--shell-muted)}
.code-box-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--shell-line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--shell-faint)}
.code-box-header span.tag-in{color:var(--shell-blue)}
.code-box-header span.tag-out{color:var(--shell-green)}
.code-directive{color:var(--shell-accent-strong);font-weight:600}
.code-val{color:#ECEAF4}

/* Assistant Wiring Grid */
.assistant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
.assistant-card{padding:20px;background:var(--shell-surface);border:1px solid var(--shell-line);border-radius:12px;transition:border-color .2s ease}
.assistant-card:hover{border-color:var(--shell-accent)}
.assistant-card h4{margin:0 0 4px;font:600 16px 'Space Grotesk',sans-serif;color:#ECEAF4}
.assistant-card span{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--shell-accent-strong);margin-bottom:10px}
.assistant-card pre{margin:0;padding:12px;background:#080b0d;border-radius:6px;font:12px 'IBM Plex Mono',monospace;color:var(--shell-muted);overflow-x:auto}

/* Cold vs Warm Performance Comparison */
.perf-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.perf-card{padding:26px;border-radius:14px;border:1px solid var(--shell-line);background:var(--shell-surface)}
.perf-card.negative{border-color:rgba(235,87,87,.3);background:rgba(235,87,87,.02)}
.perf-card.positive{border-color:rgba(113,194,155,.4);background:rgba(113,194,155,.04)}
.perf-card h3{margin:0 0 14px;font:600 20px 'Space Grotesk',sans-serif}
.perf-card.negative h3{color:#eb5757}
.perf-card.positive h3{color:var(--shell-green)}
.perf-stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--shell-line);font-size:14px}
.perf-stat-row:last-child{border-bottom:none}

/* Ecosystem Grid */
.ecosystem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
.eco-card{padding:22px;background:var(--shell-surface);border:1px solid var(--shell-line);border-radius:12px;transition:border-color .2s ease,transform .2s ease;text-decoration:none;color:inherit;display:block}
.eco-card:hover{border-color:var(--shell-accent);transform:translateY(-2px)}
.eco-card .eco-tag{font:10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--shell-accent-strong)}
.eco-card h4{margin:8px 0 6px;font:600 18px 'Space Grotesk',sans-serif;color:#ECEAF4}
.eco-card p{margin:0;font-size:13px;color:var(--shell-muted);line-height:1.5}

/* Layout Steps & Callouts */
.home-v2 .section-intro{display:grid;grid-template-columns:.7fr 1.3fr;gap:40px;align-items:end;margin-bottom:30px}.home-v2 .section-intro .shell-heading{margin-bottom:0}
.home-v2 .story-band{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--shell-line);border:1px solid var(--shell-line);border-radius:14px;overflow:hidden}.home-v2 .story-step{min-height:250px;padding:26px;background:var(--shell-surface)}.home-v2 .story-step:nth-child(2){background:color-mix(in srgb,var(--shell-surface) 90%,var(--shell-blue))}.home-v2 .story-step:nth-child(3){background:color-mix(in srgb,var(--shell-surface) 92%,var(--shell-green))}.story-step .step-no{display:block;color:var(--shell-muted);font:12px 'IBM Plex Mono',monospace}.story-step h3{margin:58px 0 10px;font:600 26px 'Space Grotesk',sans-serif;letter-spacing:-.04em}.story-step p{margin:0;color:var(--shell-muted);font-size:14px;line-height:1.6}.story-step a{display:inline-block;margin-top:22px;color:var(--shell-accent-strong);font:11px 'IBM Plex Mono',monospace}
.home-v2 .proof-callout{display:grid;grid-template-columns:1.15fr .85fr;gap:1px;background:var(--shell-line);border:1px solid var(--shell-line);border-radius:14px;overflow:hidden}.home-v2 .proof-callout-main,.home-v2 .proof-callout-side{padding:30px;background:var(--shell-surface)}.proof-callout-main h2{max-width:14ch;margin:0 0 14px;font:600 clamp(30px,4vw,50px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.055em}.proof-callout-main p{max-width:54ch;color:var(--shell-muted);font-size:15px;line-height:1.65}.proof-callout-side{display:flex;flex-direction:column;justify-content:space-between;background:color-mix(in srgb,var(--shell-surface) 90%,var(--shell-accent))}.proof-number{font:600 clamp(58px,7vw,92px)/.9 'Space Grotesk',sans-serif;letter-spacing:-.08em;color:var(--shell-accent-strong)}.proof-number-label{max-width:25ch;margin-top:10px;color:var(--shell-muted);font-size:13px;line-height:1.45}.proof-source{margin-top:32px;color:var(--shell-muted);font:11px 'IBM Plex Mono',monospace;line-height:1.5}
.home-v2 .start-band{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:34px 36px;border:1px solid var(--shell-line-strong);border-radius:14px;background:linear-gradient(105deg,rgba(213,182,108,.09),rgba(113,194,155,.05) 62%,transparent)}.home-v2 .start-band h2{margin:0 0 8px;font:600 32px/1.08 'Space Grotesk',sans-serif;letter-spacing:-.04em}.home-v2 .start-band p{margin:0;color:var(--shell-muted);font-size:14px}
