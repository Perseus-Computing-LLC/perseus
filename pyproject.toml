[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perseus-ctx"
version = "1.0.27"
description = "Live workspace context engine for AI assistants — resolve before context."
readme = "README.md"
license = "MIT"
authors = [{ name = "Perseus Computing LLC", email = "perseus@perseus.observer" }]
keywords = ["ai", "context", "context-engine", "assistant", "cli", "hermes", "claude", "cursor", "codex", "mcp", "agent-context", "agent-memory", "pre-session", "prefill", "cold-start", "zero-orientation", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0.1,<7", 'tomli==2.2.1; python_version < "3.11"']

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "coverage", "hypothesis", "jsonschema>=4.0"]
mcp = ["mcp"]
# Optional context-adapter SDKs exercised by tests/test_adapters.py (#954) —
# CI runs a dedicated leg installing these so the adapter tests never skip.
adapters = ["langchain-core>=0.3", "llama-index-core>=0.12"]

# ``uv run`` installs the default ``dev`` group, so the documented local test
# gate is self-provisioning. Keep this separate from runtime dependencies and
# mirror the optional ``dev`` extra above for pip consumers.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "coverage",
    "hypothesis",
    "jsonschema>=4.0",
    "reportlab>=4.0,<5",
]

[project.urls]
Homepage = "https://perseus.observer"
Documentation = "https://perseus.observer/docs/"
Repository = "https://github.com/Perseus-Computing-LLC/perseus"
"Release Notes" = "https://github.com/Perseus-Computing-LLC/perseus/releases"
"Bug Tracker" = "https://github.com/Perseus-Computing-LLC/perseus/issues"

[project.scripts]
perseus = "perseus:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m \"not privileged_acceptance\""
markers = [
  "slow: tests that intentionally exercise slower end-to-end or benchmark paths",
  "privileged_acceptance: tests that require the trusted cgroup broker and run only in the push-to-main acceptance workflow",
]

[tool.setuptools]
# Generated single-file artifact is intentionally committed for zero-install use.
py-modules = ["perseus"]
