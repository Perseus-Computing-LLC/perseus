name: 'Perseus Context Engine render'
description: 'Render an operator-authored context source for a compatible assistant host.'
author: 'Perseus Computing LLC'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  context_file:
    description: 'Path to the Context Engine source, relative to the repository root'
    required: false
    default: '.perseus/context.md'
  output_file:
    description: 'Output file for the assistant host, relative to the repository root'
    required: false
    default: 'CLAUDE.md'
  commit:
    description: 'Explicitly opt in to commit and push the rendered output'
    required: false
    default: 'false'
  commit_message:
    description: 'Commit message used only when commit is true'
    required: false
    default: 'chore: update Perseus context [skip ci]'

runs:
  using: 'composite'
  steps:
    - name: Install the published Perseus Context Engine release
      shell: bash
      run: python -m pip install 'perseus-ctx==1.0.26'

    - name: Render context
      id: render
      shell: bash
      env:
        PERSEUS_CONTEXT_FILE: ${{ inputs.context_file }}
        PERSEUS_OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import subprocess

        root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()

        def checked_relative(name):
            raw = os.environ[name]
            if not raw or any(ord(char) < 32 for char in raw):
                raise SystemExit(f'{name} must be a non-empty path without control characters')
            candidate = (root / raw).resolve()
            try:
                relative = candidate.relative_to(root)
            except ValueError as exc:
                raise SystemExit(f'{name} must remain inside GITHUB_WORKSPACE') from exc
            return candidate, relative.as_posix()

        context_path, _ = checked_relative('PERSEUS_CONTEXT_FILE')
        output_path, output_relative = checked_relative('PERSEUS_OUTPUT_FILE')
        if not context_path.is_file():
            raise SystemExit(f'context file does not exist: {context_path}')

        subprocess.run(
            ['perseus', 'render', str(context_path), '--output', str(output_path)],
            cwd=root,
            check=True,
        )
        line_count = len(output_path.read_text(encoding='utf-8').splitlines())
        print(f'Rendered {line_count} lines to {output_relative}')
        with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
            handle.write(f'output_file={output_relative}\n')
        PY

    - name: Commit rendered context
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      env:
        PERSEUS_RENDERED_FILE: ${{ steps.render.outputs.output_file }}
        PERSEUS_COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        set -euo pipefail
        git config user.name 'perseus[bot]'
        git config user.email 'perseus[bot]@users.noreply.github.com'
        git add -- "$PERSEUS_RENDERED_FILE"
        if git diff --cached --quiet; then
          echo 'No context changes; the committed artifact is current.'
        else
          git commit -m "$PERSEUS_COMMIT_MESSAGE"
          git push
          echo 'Context artifact committed and pushed by explicit opt-in.'
        fi
