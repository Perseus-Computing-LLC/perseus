name: CodeQL

# Static analysis (SAST) for the Python source. Complements audit.yml, which
# only covers *dependency* CVEs — CodeQL scans our own code for injection,
# path-traversal, and similar defects. Free for this public repo. Findings
# surface in a downloadable job artifact; PR analysis is deliberately read-only
# and does not upload SARIF to code scanning or request security-events write.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"   # weekly (Mon 08:00 UTC)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3 (2026-08-04)
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3 (2026-08-04)
        with:
          category: "/language:python"
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - name: Retain CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (2025-03-19)
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
