name: CodeQL

# Static analysis (SAST) for the Python source. Complements audit.yml, which
# only covers *dependency* CVEs — CodeQL scans our own code for injection,
# path-traversal, and similar defects. Free for this public repo. Findings
# surface in the repo's Security tab; this workflow does not gate merges.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"   # weekly (Mon 08:00 UTC)

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3 (2026-08-04)
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3 (2026-08-04)
        with:
          category: "/language:python"
