# PR Pilot is intentionally read-only and disabled for pull requests.
# The former agent path exposed a model key and write-capable token from a
# pull_request workflow. Review automation must be enabled only in a trusted,
# separately reviewed workflow when its credentials and write scope are needed.

name: PR Pilot — Read-only metadata check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read-only checkout of the base revision. No PR code is installed or run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Confirm read-only review boundary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER}"
          test -n "${BASE_SHA}"
          test -n "${HEAD_SHA}"
          printf 'PR Pilot disabled: metadata-only check for PR #%s (base %s, head %s)\n' "${PR_NUMBER}" "${BASE_SHA}" "${HEAD_SHA}"
          printf '%s\n' 'No PR-controlled code, model key, or write-capable credential is executed by this workflow.'
