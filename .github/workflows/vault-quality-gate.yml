name: Vault Memory Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  vault-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
        with:
          repository: Perseus-Computing-LLC/perseus-vault
          # #958: PINNED to a known-good vault SHA. The gate previously
          # followed vault main at run time, so any broken vault push (e.g.
          # 9f91028e, 2026-08-12) turned this gate red through no perseus
          # change. Bump procedure: pick a vault main commit whose own CI is
          # green (Build and Test + Memory quality gate), update this ref,
          # and merge — the gate is deterministic and auditable.
          ref: fe62d54e8768f8ac38f65d89f72a0fb4d8791ba4  # vault main, 2026-08-12, quality gate green (#989)
          path: perseus-vault
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: "3.12"
      - name: Build Vault quality benchmark
        working-directory: perseus-vault
        run: |
          # Default features: the quality benchmark's recall-outcome and
          # replay cases exercise the bundled embedding backend, so a
          # no-default-features binary cannot pass them. GIT_HASH is read by
          # main.rs at compile time (same contract as the vault's own CI).
          GIT_HASH="$(git rev-parse HEAD)" cargo build --locked
          python3 benchmark/quality/run.py --bin target/debug/perseus-vault --out /tmp/vault-quality-report.json
          python3 benchmark/quality/scorecard.py /tmp/vault-quality-report.json --out /tmp/vault-quality-scorecard.json
      - name: Enforce Vault scorecard
        run: python3 scripts/check_vault_quality_scorecard.py /tmp/vault-quality-scorecard.json
      - name: Upload Vault quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (2025-03-19)
        with:
          name: perseus-vault-quality-scorecard
          path: |
            /tmp/vault-quality-report.json
            /tmp/vault-quality-scorecard.json
          if-no-files-found: warn

  real-vault-density:
    name: Governed real Vault density replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (2026-07-16)
        with:
          repository: Perseus-Computing-LLC/perseus-vault
          ref: 88c14ed9fc430f8a80094796617b3f95fe3f4a36  # #1131 ephemeral fixture
          path: perseus-vault
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Build lean Vault binary
        working-directory: perseus-vault
        run: cargo build --locked --no-default-features
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (2025-04-24)
        with:
          python-version: "3.12"
      - name: Install benchmark test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run authenticated replay and negative contract
        env:
          PERSEUS_VAULT_BENCHMARK_BIN: ${{ github.workspace }}/perseus-vault/target/debug/perseus-vault
        run: |
          python -m pytest tests/test_real_vault_density_benchmark.py -q -m slow
          python benchmark/real_vault_density/run.py \
            --bin "$PERSEUS_VAULT_BENCHMARK_BIN" \
            --out /tmp/real-vault-density.json
          python benchmark/real_vault_density/run.py \
            --bin "$PERSEUS_VAULT_BENCHMARK_BIN" \
            --corpus benchmark/real_vault_density/sanitized_corpus.json \
            --probes benchmark/real_vault_density/probes.json \
            --out /tmp/real-vault-density-probes.json

# Blocking by default. A maintainer override requires a documented remediation
# issue and release-note record, following the override_policy embedded in the
# Vault scorecard; do not weaken this workflow with continue-on-error.
