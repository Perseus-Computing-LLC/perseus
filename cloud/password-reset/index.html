<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Perseus Cloud</title>
  <meta name="description" content="Request a Perseus Cloud password-reset link.">
  <link rel="canonical" href="https://perseus.observer/cloud/password-reset/">
  <link rel="icon" href="/assets/perseus.svg">
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/perseus.css">
  <style>
    .auth-page{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}.auth-card{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:420px;width:100%}.auth-card h1{font-size:22px;margin:0 0 8px}.sub{color:var(--text-faint);font-size:14px;margin:0 0 28px}.form-group{margin-bottom:18px}.form-group label{display:block;font-size:13px;color:var(--text-faint);margin-bottom:6px}.form-group input{width:100%;box-sizing:border-box;font:14px 'JetBrains Mono',monospace;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}.btn-full{width:100%;padding:14px;font-size:15px}.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin:0 0 20px;display:none}.error{background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);color:#ff8888}.success{background:rgba(0,200,120,.12);border:1px solid rgba(0,200,120,.3);color:#00c878}.foot{text-align:center;margin-top:20px;font-size:13px;color:var(--text-faint)}.foot a{color:var(--violet)}
  </style>

<script src="/assets/error-beacon.js" defer></script>
</head>
<body class="auth-page"><main class="auth-card"><h1>Reset your password</h1><p class="sub">Enter the email for your Perseus Cloud account. If it exists, we will send a reset link.</p><div id="error" class="alert error"></div><div id="success" class="alert success"></div><form id="form"><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com" required></div><button id="submit" class="btn btn-amber btn-full" type="submit">Send reset link</button></form><p class="foot"><a href="/cloud/login/">Back to log in</a> · <a href="/cloud/">Back to Cloud</a></p></main><script>
const API_BASE='https://cloud-api.perseus.observer/api';const form=document.getElementById('form');const error=document.getElementById('error');const success=document.getElementById('success');const submit=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';success.style.display='none';submit.disabled=true;try{const r=await fetch(API_BASE+'/accounts/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});if(!r.ok)throw new Error('We could not process that request. Please try again.');success.textContent='If an account matches that email, a reset link is on its way.';success.style.display='block';form.reset()}catch(err){error.textContent=err.message;error.style.display='block'}finally{submit.disabled=false}});
</script></body></html>
